<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atomic Compute Performance Analytics Dashboard</title>
<style>
body { font-family: -apple-system, system-ui, sans-serif; background: #f6f8fa; margin: 0; padding: 40px; }
.container { max-width: 850px; margin: 0 auto; background: #ffffff; border: 1px solid #d0d7de; border-radius: 6px; padding: 32px; }
h1 { color: #0969da; margin-top: 0; border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
.chart-box { text-align: center; margin: 24px 0; padding: 16px; background: #fafafa; border: 1px solid #d0d7de; border-radius: 6px; }
img { max-width: 100%; height: auto; }
.badge-container { margin: 16px 0; }
</style>
</head>
<body>
<div class="container">
<h1>Atomic Compute Processing Center Analytics Portal</h1>
<p>Continuous Integration (CI/CD) Telemetry Trace Interface</p>
<div class="badge-container">
<!-- Dynamic status badge: reads benchmark_history.json at page load instead
     of the old hardcoded "SYSTEM PASSING" layer. -->
Build Verification Engine Status: <span id="runtime-status-badge" style="background:#57606a; color:#fff; padding:3px 8px; font-weight:bold; border-radius:12px; font-size:12px;">EVALUATING</span>
</div>
<div class="chart-box">
<h3>Calculus Execution Speeds Profile History Timeline</h3>
<img src="benchmark_trends.png" alt="Atomic Compute Performance Regression Trends Timeline Chart" onerror="this.style.display='none';">
</div>
</div>
<script>
// Reads the compiled metrics array to set badge state at page load.
fetch('benchmark_history.json')
  .then(response => response.json())
  .then(data => {
    const latestRun = data[data.length - 1];
    const badge = document.getElementById('runtime-status-badge');
    if (latestRun && latestRun.passed === true) {
      badge.textContent = "SYSTEM PASSING";
      badge.style.background = "#2da44e";
    } else {
      badge.textContent = "PIPELINE REGRESSION";
      badge.style.background = "#cf222e";
    }
  })
  .catch(() => {
    document.getElementById('runtime-status-badge').textContent = "DATA EXPUNGED";
  });
</script>
</body>
</html>
